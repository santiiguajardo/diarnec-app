<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DIARNEC — Caja</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.min.js" integrity="sha384-JBR+x8blGwjDRO63aHCGiZMD4VNiTR4ZUGA+N6ZKLf3zNt1fK8IBpcgPaMrxqWBp" crossorigin="anonymous"></script>
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/shared.css">
<link rel="stylesheet" href="../css/admin.css">
<style>
  .caja-resumen{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:20px;}
  .caja-card{background:var(--navy);color:#fff;border-radius:14px;padding:16px 20px;font-family:'Space Grotesk',sans-serif;}
  .caja-card span{display:block;opacity:.75;font-weight:500;font-family:'Inter',sans-serif;font-size:13px;margin-bottom:6px;}
  .caja-card b{font-size:clamp(16px,1.9vw,22px);white-space:nowrap;}
  .caja-card.destacada{background:#0B1824;box-shadow:inset 0 0 0 2px rgba(255,255,255,.18);}
  .caja-card .pos{color:#4ade80;}
  .caja-card .neg{color:#ff8a80;}
  @media (max-width:1150px){ .caja-resumen{grid-template-columns:repeat(2,minmax(0,1fr));} }
  .gasto-form{display:grid;grid-template-columns:2fr 1fr auto auto;gap:8px;align-items:center;margin-bottom:16px;}
  .gasto-form input{padding:9px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px;width:100%;}
  .btn-orange{background:#e67e22;color:#fff;}
  .btn-green{background:#27ae60;color:#fff;}
  .btn-edit{background:#253745;color:#fff;}
  .row-btns{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap;}
  .row-btns .btn-sm{white-space:nowrap;}
  td.wrap{white-space:normal;}
  tr.selected{outline:2px solid var(--navy);outline-offset:-2px;}
  tr.selected td{background:rgba(18,36,54,.06);}
  @media (max-width:800px){ .gasto-form{grid-template-columns:1fr 1fr;} }
</style>
</head>
<body>
<div id="app-shell"></div>
<script type="module" src="../js/modules/caja.js"></script>
</body>
</html>
