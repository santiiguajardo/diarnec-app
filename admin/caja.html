<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DIARNEC — Caja</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.min.js"></script>
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/shared.css">
<link rel="stylesheet" href="../css/admin.css">
<style>
  .caja-bar{
    display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;
    background:var(--navy);color:#fff;border-radius:14px;padding:16px 24px;margin-bottom:20px;
    font-family:'Space Grotesk',sans-serif;
  }
  .caja-bar .left{display:flex;gap:24px;flex-wrap:wrap;}
  .caja-bar span{opacity:.7;font-weight:500;font-family:'Inter',sans-serif;font-size:13px;margin-right:6px;}
  .caja-bar .salidas{color:#ff8a80;}
  .caja-bar .real{font-size:19px;}
  .caja-bar .real.neg{color:#ff8a80;}
  .caja-bar .real.pos{color:#4ade80;}
  .gasto-form{display:grid;grid-template-columns:2fr 1fr auto auto auto;gap:8px;align-items:center;}
  .gasto-form input{padding:9px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px;width:100%;}
  .btn-orange{background:#e67e22;color:#fff;}
  .btn-green{background:#27ae60;color:#fff;}
  .hint{color:var(--muted);font-size:12px;font-style:italic;margin:8px 0;}
  tr.selected{outline:2px solid var(--navy);outline-offset:-2px;}
  tr.selected td{background:rgba(18,36,54,.06);}
  @media (max-width:800px){ .gasto-form{grid-template-columns:1fr 1fr;} }
</style>
</head>
<body>
<div id="app-shell"></div>
<script type="module" src="../js/modules/caja.js"></script>
</body>
</html>
