<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DIARNEC — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.min.js" integrity="sha384-JBR+x8blGwjDRO63aHCGiZMD4VNiTR4ZUGA+N6ZKLf3zNt1fK8IBpcgPaMrxqWBp" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js" integrity="sha384-NrKB+u6Ts6AtkIhwPixiKTzgSKNblyhlk0Sohlgar9UHUBzai/sgnNNWWd291xqt" crossorigin="anonymous"></script>
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/shared.css">
<link rel="stylesheet" href="../css/admin.css">
<style>
  /* Paleta nueva, probada acá primero ("por ahora" según el pedido) antes de pasarla
     al resto del panel. --muted usa Black russian con opacidad baja en vez de Baby grey
     puro porque #BABABA sobre blanco queda casi ilegible en texto chico. */
  :root{
    --navy:#000029;              /* Black russian */
    --ink:#000029;                /* Black russian */
    --paper:#DCDEE2;              /* Grey placidity */
    --line:#BABABA;               /* Baby grey */
    --muted:rgba(0,0,41,.55);
    --accent:#173DED;             /* Palatinate blue */
    --accent-2:#000051;           /* Alucard night */
  }
  body{ background:var(--paper); }

  /* ---- selector de semana ---- */
  .dash-bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:20px;}
  .dash-week{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px;}
  .dash-week button{background:none;border:none;width:34px;height:34px;border-radius:8px;font-size:18px;cursor:pointer;color:var(--accent-2);}
  .dash-week button:hover:not(:disabled){background:var(--paper);}
  .dash-week button:disabled{opacity:.3;cursor:default;}
  .dash-week select, .dash-cmp-box select{border:none;background:transparent;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14px;color:var(--navy);padding:6px 4px;cursor:pointer;min-width:190px;}
  .btn-cmp{border:1px solid var(--accent);background:#fff;color:var(--accent);border-radius:12px;padding:10px 16px;font-weight:600;font-size:13px;cursor:pointer;}
  .btn-cmp.on{background:var(--accent);color:#fff;}
  .dash-cmp-box{display:none;align-items:center;gap:8px;background:#fff;border:1px dashed var(--accent);border-radius:12px;padding:6px 12px;font-size:12px;color:var(--muted);}
  .dash-cmp-box.open{display:flex;}
  .dash-cmp-box select{min-width:170px;}

  /* ---- indicadores ---- */
  .kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:14px;margin-bottom:22px;}
  .kpi-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;}
  .kpi-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .kpi-top span{font-size:12px;color:var(--muted);font-weight:500;}
  .kpi-icon{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:15px;flex:none;background:rgba(186,186,186,.2);}
  .kpi-card b{display:block;font-family:'Space Grotesk',sans-serif;font-size:21px;color:var(--navy);}
  .kpi-card b.neg{color:var(--accent-2);}
  .kpi-sub{font-size:11px;color:var(--muted);margin-top:5px;min-height:14px;}
  .kpi-cmp{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:11px;color:var(--muted);display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap;}
  .delta{font-weight:700;font-size:12px;}
  .delta.bueno{color:var(--accent);}
  .delta.malo{color:#C0392B;}
  .delta.igual{color:var(--muted);}

  .dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:22px;align-items:stretch;}
  .dash-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px;gap:8px;flex-wrap:wrap;}
  .dash-head h3{margin:0;}
  .dash-sub{font-size:12px;color:var(--muted);}
  .chart-box{position:relative;height:250px;}

  /* ---- balance: plata a proveedores vs. plata ganada ---- */
  .balance-card{margin-bottom:22px;}
  .balance-nums{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px;}
  .balance-num{background:var(--paper);border-radius:12px;padding:14px 16px;position:relative;}
  .balance-dot{position:absolute;top:16px;right:16px;width:10px;height:10px;border-radius:50%;}
  .balance-lbl{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;max-width:80%;}
  .balance-num b{display:block;font-family:'Space Grotesk',sans-serif;font-size:24px;}
  .balance-bars{display:flex;flex-direction:column;gap:10px;margin-bottom:12px;}
  .balance-bar-row{display:grid;grid-template-columns:80px 1fr 100px;gap:10px;align-items:center;}
  .balance-bar-lbl{font-size:12px;color:var(--muted);}
  .balance-bar-track{height:10px;border-radius:100px;background:var(--paper);overflow:hidden;}
  .balance-bar-fill{height:100%;border-radius:100px;transition:width .3s;}
  .balance-bar-val{text-align:right;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:13px;}
  .balance-foot{font-size:12.5px;color:var(--ink);background:var(--paper);border-radius:10px;padding:10px 14px;margin-bottom:6px;}
  .balance-chart{height:220px;margin-top:14px;}
  @media (max-width:640px){ .balance-nums{grid-template-columns:1fr;} .balance-bar-row{grid-template-columns:64px 1fr 84px;} }

  /* ---- rankings ---- */
  .rk-row{display:grid;grid-template-columns:26px 1fr 96px;gap:10px;align-items:center;padding:8px 0;border-top:1px solid rgba(186,186,186,.5);}
  .rk-row:first-of-type{border-top:none;}
  .rk-pos{font-weight:700;color:var(--muted);text-align:center;font-size:13px;}
  .rk-row.top1 .rk-pos{color:#D9A400;font-size:16px;}
  .rk-row.top2 .rk-pos{color:#8A929E;font-size:16px;}
  .rk-row.top3 .rk-pos{color:#B87333;font-size:16px;}
  .rk-nom{font-size:13px;color:var(--ink);min-width:0;}
  .rk-nom b{font-weight:600;}
  .rk-nom small{display:block;color:var(--muted);font-size:11px;margin-top:1px;}
  .rk-barra{height:6px;border-radius:100px;background:var(--paper);margin-top:5px;overflow:hidden;}
  .rk-barra i{display:block;height:100%;border-radius:100px;background:var(--accent);}
  .rk-barra.rojo i{background:#C0392B;}
  .rk-val{text-align:right;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:13px;color:var(--navy);}
  .rk-val small{display:block;font-family:'Inter',sans-serif;font-weight:500;font-size:10px;color:var(--muted);}
  .rk-mov{font-size:10px;font-weight:700;margin-left:4px;}
  .rk-mov.sube{color:var(--accent);} .rk-mov.baja{color:#C0392B;}
  .rk-vacio{color:var(--muted);font-size:13px;text-align:center;padding:26px 0;}

  .donut-wrap{position:relative;max-width:190px;margin:0 auto;}
  .donut-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;}
  .donut-center b{font-family:'Space Grotesk',sans-serif;font-size:15px;color:var(--navy);}
  .donut-center span{font-size:10px;color:var(--muted);}
  .legend{display:flex;flex-direction:column;gap:9px;margin-top:18px;font-size:12px;}
  .legend-row{display:flex;align-items:center;gap:8px;}
  .legend-dot{width:9px;height:9px;border-radius:50%;flex:none;}
  .legend-row span{flex:1;color:var(--muted);}
  .legend-row b{color:var(--ink);font-weight:600;}
  .legend-empty{color:var(--muted);font-size:13px;text-align:center;padding:20px 0;}

  .stock-item{margin-bottom:16px;}
  .stock-item:last-child{margin-bottom:0;}
  .stock-top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px;gap:8px;}
  .stock-top .name{color:var(--ink);}
  .stock-top b{font-weight:700;white-space:nowrap;}
  .stock-bar{height:7px;border-radius:4px;background:var(--paper);overflow:hidden;}
  .stock-bar > div{height:100%;border-radius:4px;}

  @media (max-width:900px){ .dash-grid{grid-template-columns:1fr;} .dash-week select{min-width:150px;} }
</style>
</head>
<body>
<div id="app-shell"></div>
<script type="module" src="../js/modules/dashboard.js"></script>
</body>
</html>
