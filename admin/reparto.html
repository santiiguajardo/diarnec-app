<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#122436">
<link rel="apple-touch-icon" href="../img/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="../img/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="../img/favicon-192.png">
<title>DIARNEC — Hoja de reparto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.min.js" integrity="sha384-JBR+x8blGwjDRO63aHCGiZMD4VNiTR4ZUGA+N6ZKLf3zNt1fK8IBpcgPaMrxqWBp" crossorigin="anonymous"></script>
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/shared.css">
<link rel="stylesheet" href="../css/admin.css">
<style>
  .rp-error{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:#FDECEA;border:1px solid #F0B9B2;color:#A93226;border-radius:12px;padding:12px 16px;margin-bottom:16px;font-size:13px;font-weight:600;}
  .rp-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:12px;}
  .rp-sub{font-size:13px;color:var(--muted);margin-top:3px;}
  .rp-btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .rp-orden{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);}
  .rp-orden select{padding:7px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px;background:#fff;}
  .rp-contador{font-size:12.5px;font-weight:700;color:var(--navy);margin-bottom:8px;}
  .rp-ped{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:#fff;}
  .rp-ped.on{border-color:#2BB673;background:#F1FBF6;}
  .rp-chk input{width:22px;height:22px;cursor:pointer;}
  .rp-ped-info{flex:1;min-width:0;font-size:14px;}
  .rp-ped-tot{text-align:right;font-weight:800;color:var(--navy);white-space:nowrap;} .rp-ped-tot small{display:block;font-weight:500;color:var(--muted);font-size:11px;}
  .rp-dir{font-size:13px;color:var(--ink);margin-top:3px;}
  .rp-vend{font-size:12px;color:var(--muted);margin-top:2px;}
  .rp-tag{display:inline-block;margin-left:6px;padding:1px 9px;border-radius:100px;font-size:11px;font-weight:700;color:#fff;}
  .rp-comercio{background:#2BB673;} .rp-particular{background:#2E86DE;} .rp-venta{background:#17804F;} .rp-pend{background:#e67e22;}
  .rp-alerta{background:#FFF4E5;border:1px solid #F5D9A0;color:#7A5300;border-radius:10px;padding:9px 12px;font-size:13px;margin-bottom:10px;}
  .rp-nota{font-size:12px;color:var(--muted);margin-bottom:8px;}
  .rp-tabla{width:100%;border-collapse:collapse;font-size:14px;}
  .rp-tabla th{text-align:left;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding:5px 8px;border-bottom:2px solid var(--line);}
  .rp-tabla td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle;}
  .rp-tabla .num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;}
  .rp-tabla .rp-cant{font-size:20px;font-weight:800;color:var(--navy);}
  .rp-tabla td.rp-check{text-align:center;width:80px;font-size:18px;}
  .rp-tabla th.rp-check{text-align:center;width:80px;}
  .rp-marca{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;}
  .rp-un{font-size:12px;color:var(--muted);}
  .rp-h-cli{font-family:var(--display,'Archivo',sans-serif);color:var(--navy);font-size:18px;margin:22px 0 12px;}
  .rp-clientes{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start;}
  .rp-cli{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;break-inside:avoid;}
  .rp-cli header{display:flex;gap:12px;align-items:flex-start;margin-bottom:8px;}
  .rp-orden-n{flex:none;width:34px;height:34px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;}
  .rp-cli-t{flex:1;min-width:0;} .rp-cli-t small{color:var(--muted);font-size:12px;}
  .rp-mini td{padding:5px 4px;font-size:13.5px;}
  .rp-cli footer{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:2px dashed var(--line);font-size:14px;}
  .rp-firma{color:var(--muted);}
  @media (max-width:900px){ .rp-clientes{grid-template-columns:1fr;} .rp-ped{flex-wrap:wrap;} }
  @media print{
    .admin-sidebar,.admin-topbar,.no-print,.rp-error{display:none !important;}
    .admin-main{margin:0 !important;} body{background:#fff;}
    .admin-section{box-shadow:none;border:none;padding:0;}
    .rp-clientes{grid-template-columns:1fr 1fr;gap:10px;}
    .rp-cli{break-inside:avoid;}
    .rp-consol{break-after:page;}
  }
</style>
</head>
<body>

<div id="app-shell"></div>

<script type="module" src="../js/modules/reparto.js"></script>
</body>
</html>
