<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#122436">
<link rel="apple-touch-icon" href="../img/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="../img/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="../img/favicon-192.png">
<title>DIARNEC — Conteo de inventario</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.min.js" integrity="sha384-JBR+x8blGwjDRO63aHCGiZMD4VNiTR4ZUGA+N6ZKLf3zNt1fK8IBpcgPaMrxqWBp" crossorigin="anonymous"></script>
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/shared.css">
<link rel="stylesheet" href="../css/admin.css">
<style>
  .cn-error{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:#FDECEA;border:1px solid #F0B9B2;color:#A93226;border-radius:12px;padding:12px 16px;margin-bottom:16px;font-size:13px;font-weight:600;}
  .cn-sub{font-size:13px;color:var(--muted);margin:0 0 12px;line-height:1.45;}
  .cn-aviso{background:#FFF4E5;border:1px solid #F5D9A0;color:#7A5300;border-radius:10px;padding:9px 12px;font-size:13px;font-weight:600;margin-bottom:12px;}
  .cn-filtros{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:10px;}
  .cn-filtros label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600;}
  .cn-filtros select,.cn-filtros input[type=search]{padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:#fff;min-width:160px;}
  .cn-filtros .cn-chk{flex-direction:row;align-items:center;gap:6px;font-weight:500;} .cn-filtros .cn-chk input{width:auto;min-width:0;}
  .cn-progreso{font-size:13px;color:var(--navy);margin:6px 0 10px;}
  .cn-tabla-wrap{overflow-x:auto;}
  .cn-tabla{width:100%;border-collapse:collapse;font-size:14px;}
  .cn-tabla th{text-align:left;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding:6px 8px;border-bottom:2px solid var(--line);position:sticky;top:0;background:#fff;}
  .cn-tabla td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle;}
  .cn-tabla .num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;}
  .cn-marca{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;white-space:nowrap;}
  .cn-un{font-size:12px;color:var(--muted);}
  .cn-in{width:110px;padding:9px 10px;border:1.5px solid var(--line);border-radius:8px;font-size:16px;font-weight:700;text-align:right;}
  .cn-in:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px rgba(18,36,54,.12);}
  .cn-dif{font-weight:800;min-width:110px;}
  .cn-dif.ok{color:#17804F;} .cn-dif.falta{color:#C0392B;} .cn-dif.sobra{color:#2E86DE;} .cn-dif.mal{color:#C0392B;font-size:12px;}
  b.falta{color:#C0392B;} b.sobra{color:#2E86DE;} span.falta{color:#C0392B;font-weight:700;}
  .cn-pie{position:sticky;bottom:0;z-index:20;display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 16px;box-shadow:0 -4px 18px rgba(18,36,54,.12);margin-top:12px;}
  .cn-resumen{flex:1 1 320px;font-size:13px;color:var(--ink);}
  .cn-pie input[type=text]{padding:9px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px;min-width:200px;}
  .cn-aplicar{padding:11px 16px;font-size:14px;} .cn-aplicar:disabled,.cn-pie .btn-sm:disabled{opacity:.45;cursor:default;}
  .cn-listo{margin-top:16px;border-left:5px solid #2BB673;}
  @media (max-width:640px){ .cn-in{width:90px;} .cn-pie{position:static;} .cn-filtros select,.cn-filtros input[type=search]{min-width:130px;} }
</style>
</head>
<body>

<div id="app-shell"></div>

<script type="module" src="../js/modules/conteo.js"></script>
</body>
</html>
