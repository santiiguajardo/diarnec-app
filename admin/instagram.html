<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#122436">
<link rel="apple-touch-icon" href="../img/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="../img/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="../img/favicon-192.png">
<title>DIARNEC — Instagram</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.min.js" integrity="sha384-JBR+x8blGwjDRO63aHCGiZMD4VNiTR4ZUGA+N6ZKLf3zNt1fK8IBpcgPaMrxqWBp" crossorigin="anonymous"></script>
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/shared.css">
<link rel="stylesheet" href="../css/admin.css">
<style>
  .ig-card{background:#fff;border:1px solid var(--line);border-top:5px solid #E1306C;border-radius:14px;padding:22px;margin-bottom:24px;}
  .ig-hist{border-top-color:var(--navy);}
  .ig-head h3{font-family:var(--display,'Archivo',sans-serif);color:var(--navy);font-size:19px;margin:0;}
  .ig-head p{font-size:13px;color:var(--muted);margin:2px 0 16px;}
  .ig-form{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .ig-form label{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:600;color:var(--navy);}
  .ig-form label small{font-weight:400;color:var(--muted);}
  .ig-form .ancho{grid-column:1 / -1;}
  .ig-form input,.ig-form textarea{padding:10px 11px;border:1px solid var(--line);border-radius:8px;font-size:14px;width:100%;background:#fff;font-weight:400;color:var(--ink);font-family:inherit;}
  .ig-form textarea{min-height:96px;resize:vertical;}
  .ig-form input:focus,.ig-form textarea:focus{outline:none;border-color:#E1306C;box-shadow:0 0 0 2px rgba(225,48,108,.18);}
  .ig-acciones-form{display:flex;gap:10px;margin-top:14px;}
  .ig-btn{padding:11px 18px;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap;}
  .ig-btn-rosa{background:#E1306C;color:#fff;}
  .ig-btn-gris{background:#fff;color:#4B5563;border:1px solid #CBD0D8;}
  .ig-btn:hover{filter:brightness(1.08);}
  .ig-mini{padding:6px 11px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid transparent;background:#fff;}
  .ig-mini-grey{color:#4B5563;border-color:#CBD0D8;}
  .ig-mini-green{color:#1E8E5A;border-color:#9ED9BC;}
  .ig-mini-red{color:#C0392B;border-color:#F0B9B2;background:#FDECEA;}
  .ig-acciones{white-space:nowrap;text-align:right;}
  .ig-acciones .ig-mini + .ig-mini{margin-left:6px;}
  .ig-pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700;}
  .ig-on{background:#DDF3E8;color:#1E8E5A;} .ig-off{background:#E5E7EB;color:#6B7280;} .ig-err{background:#FDECEA;color:#C0392B;}
  .ig-chip{display:inline-block;background:#FDE8EF;color:#B3174F;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:600;margin:0 4px 4px 0;}
  .ig-aviso{display:none;margin:10px 0;padding:10px 14px;border-radius:9px;font-size:13px;line-height:1.4;}
  .ig-aviso.error{display:block;background:#FDECEA;color:#A93226;border:1px solid #F0B9B2;}
  .ig-aviso.ok{display:block;background:#E6F6EE;color:#1E8E5A;border:1px solid #BFE5D2;}
  .ig-msg{max-width:340px;white-space:pre-wrap;font-size:13px;color:var(--ink);}
  .ig-mono{font-family:'JetBrains Mono',monospace;font-size:12px;}
  @media (max-width:800px){ .ig-form{grid-template-columns:1fr;} .ig-card{padding:16px;} }
</style>
</head>
<body>
<div id="app-shell"></div>
<script type="module" src="../js/modules/instagram.js"></script>
</body>
</html>
