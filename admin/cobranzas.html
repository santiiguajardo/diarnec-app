<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#122436">
<link rel="apple-touch-icon" href="../img/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="../img/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="../img/favicon-192.png">
<title>DIARNEC — Cobranzas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.min.js" integrity="sha384-JBR+x8blGwjDRO63aHCGiZMD4VNiTR4ZUGA+N6ZKLf3zNt1fK8IBpcgPaMrxqWBp" crossorigin="anonymous"></script>
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/shared.css">
<link rel="stylesheet" href="../css/admin.css">
<style>
  .cb-resumen,.rp-resumen{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:14px;}
  .cb-card,.rp-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 16px;}
  .cb-card small,.rp-card small{display:block;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:4px;}
  .cb-card b,.rp-card b{font-size:22px;color:var(--navy);}
  .rp-card.rojo b{color:#C0392B;}
  .cb-check{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-bottom:10px;}
  .cb-tabla{width:100%;border-collapse:collapse;}
  .cb-tabla th,.cb-tabla td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;font-size:14px;vertical-align:middle;}
  .cb-tabla th{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);}
  .cb-tabla .num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;}
  .cb-tabla .debe{font-weight:800;color:#C0392B;font-size:16px;}
  .cb-tabla .acc{text-align:right;}
  .cb-tabla tr.sin-deuda{opacity:.55;}
  .cb-tel{font-size:12px;color:var(--muted);margin-top:2px;}
  .cb-tag{display:inline-block;padding:2px 9px;border-radius:100px;font-size:11px;font-weight:700;color:#fff;}
  .cb-vendedor{background:#c0392b;} .cb-cliente{background:#16a085;} .cb-online{background:#2E86DE;}
  .btn-wa{background:#25D366;color:#fff;border:none;}
  #cb-msg{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;resize:vertical;}
  .cb-msg-acc{display:flex;flex-direction:column;gap:8px;margin-top:10px;align-items:flex-start;}
  .cb-vista{font-size:12px;color:var(--muted);background:var(--paper);border-radius:8px;padding:8px 10px;display:block;}
  @media (max-width:640px){ .cb-tabla th:nth-child(2),.cb-tabla td:nth-child(2){display:none;} }
</style>
</head>
<body>

<div id="app-shell"></div>

<script type="module" src="../js/modules/cobranzas.js"></script>
</body>
</html>
