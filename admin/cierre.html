<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#122436">
<link rel="apple-touch-icon" href="../img/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="../img/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="../img/favicon-192.png">
<title>DIARNEC — Cierre del día</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.min.js" integrity="sha384-JBR+x8blGwjDRO63aHCGiZMD4VNiTR4ZUGA+N6ZKLf3zNt1fK8IBpcgPaMrxqWBp" crossorigin="anonymous"></script>
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/shared.css">
<link rel="stylesheet" href="../css/admin.css">
<style>
  .cd-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px;}
  .cd-fecha{display:flex;align-items:center;gap:6px;}
  .cd-fecha button{border:1px solid var(--line);background:#fff;border-radius:10px;width:36px;height:36px;font-size:18px;font-weight:700;cursor:pointer;color:var(--navy);}
  .cd-fecha button:disabled{opacity:.35;cursor:default;}
  .cd-fecha .cd-hoy{width:auto;padding:0 14px;font-size:13px;font-weight:700;}
  .cd-fecha input{padding:8px 10px;border:1px solid var(--line);border-radius:10px;font-size:14px;background:#fff;}
  .cd-acciones{display:flex;gap:8px;flex-wrap:wrap;}
  .cd-titulo{font-family:var(--display,'Archivo',sans-serif);color:var(--navy);font-size:22px;margin:14px 0 14px;}
  .cd-error{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:#FDECEA;border:1px solid #F0B9B2;color:#A93226;border-radius:12px;padding:12px 16px;margin-bottom:16px;font-size:13px;font-weight:600;}
  .cd-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:14px;}
  .cd-kpi{background:#fff;border:1px solid var(--line);border-left:5px solid var(--navy);border-radius:12px;padding:12px 16px;}
  .cd-kpi small{display:block;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:4px;}
  .cd-kpi b{display:block;font-size:24px;color:var(--navy);font-family:var(--display,'Archivo',sans-serif);}
  .cd-kpi em{display:block;font-style:normal;font-size:12px;color:var(--muted);margin-top:2px;}
  .cd-kpi.verde{border-left-color:#2BB673;} .cd-kpi.naranja{border-left-color:#E0A458;} .cd-kpi.azul{border-left-color:#2E86DE;}
  .cd-kpi.rojo{border-left-color:#C0392B;} .cd-kpi.rojo b{color:#C0392B;}
  .cd-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start;}
  .cd-grid .admin-section{margin-bottom:0;}
  .cd-ancho{grid-column:1 / -1;}
  .cd-tabla{width:100%;border-collapse:collapse;font-size:13.5px;}
  .cd-tabla th{text-align:left;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding:4px 6px;border-bottom:1px solid var(--line);}
  .cd-tabla td{padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top;}
  .cd-tabla .num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;}
  .cd-tabla tr.cd-total td{font-weight:800;color:var(--navy);border-top:2px solid var(--navy);border-bottom:none;font-size:15px;}
  .cd-tag{display:inline-block;margin-left:4px;padding:1px 8px;border-radius:100px;background:var(--paper);color:var(--muted);font-size:11px;font-weight:600;}
  .cd-sub{font-size:12px;color:var(--muted);}
  .cd-vacio{font-size:13px;color:var(--muted);padding:6px 0;}
  .cd-det{margin-top:10px;font-size:13px;} .cd-det summary{cursor:pointer;font-weight:600;color:var(--navy);margin-bottom:6px;}
  .cd-chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;}
  .cd-chip{background:var(--paper);border-radius:100px;padding:5px 12px;font-size:12.5px;color:var(--ink);}
  .cd-chip.rojo{background:#FDECEA;color:#A93226;} .cd-chip.naranja{background:#FFF4E5;color:#9A5B00;}
  .cd-alerta{background:#FFF4E5;border:1px solid #F5D9A0;color:#7A5300;border-radius:10px;padding:9px 12px;font-size:13px;}
  .cd-alerta a{color:#7A5300;font-weight:700;}
  .cd-ok{color:#17804F;font-size:13px;font-weight:600;}
  .cd-sinstock{font-size:12.5px;color:#A93226;margin-top:8px;line-height:1.4;}
  .cd-nota{font-size:12px;color:var(--muted);margin:8px 0;}
  .cd-contado{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-top:14px;}
  .cd-contado label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:700;color:var(--navy);}
  .cd-contado input{padding:10px 12px;border:1.5px solid var(--navy);border-radius:10px;font-size:16px;font-weight:700;width:200px;}
  .cd-dif{font-size:14px;font-weight:700;padding:8px 0;}
  .cd-dif.ok{color:#17804F;} .cd-dif.sobra{color:#2E86DE;} .cd-dif.falta{color:#C0392B;}
  @media (max-width:900px){ .cd-grid{grid-template-columns:1fr;} }
  @media print{
    .admin-sidebar,.admin-topbar,.cd-bar,.cd-error{display:none !important;}
    .admin-main{margin:0 !important;} body{background:#fff;}
    .admin-section,.cd-kpi{break-inside:avoid;box-shadow:none;}
    .cd-grid{grid-template-columns:1fr 1fr;}
    .cd-det[open] summary{display:none;}
  }
</style>
</head>
<body>

<div id="app-shell"></div>

<script type="module" src="../js/modules/cierre.js"></script>
</body>
</html>
