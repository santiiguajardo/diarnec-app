<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#122436">
<link rel="apple-touch-icon" href="../img/apple-touch-icon.png">
<title>DIARNEC — Usuarios</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.min.js" integrity="sha384-JBR+x8blGwjDRO63aHCGiZMD4VNiTR4ZUGA+N6ZKLf3zNt1fK8IBpcgPaMrxqWBp" crossorigin="anonymous"></script>
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/shared.css">
<link rel="stylesheet" href="../css/admin.css">
<style>
  .usr-form{display:grid;grid-template-columns:1fr 1fr 1fr 1fr auto;gap:8px;align-items:start;}
  .row-actions{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap;}
  .usr-form input, .usr-form select{padding:9px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px;width:100%;}
  .usr-form button{padding:9px 16px;}
  .usr-msg{grid-column:1/-1;font-size:13px;margin-top:2px;}
  .usr-msg.err{color:#C0392B;}
  .usr-msg.ok{color:#2BB673;}
  .rol-badge{display:inline-block;padding:3px 10px;border-radius:100px;font-size:11px;font-weight:700;color:#fff;}
  .rol-admin{background:#122436;}
  .rol-encargado{background:#e67e22;}
  .rol-vendedor{background:#2ecc71;}
  @media (max-width:700px){ .usr-form{grid-template-columns:1fr;} }
</style>
</head>
<body>
<div id="app-shell"></div>
<script type="module" src="../js/modules/usuarios.js"></script>
</body>
</html>
