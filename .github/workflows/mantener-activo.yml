name: Mantener activo Supabase

# El plan gratis de Supabase pausa el proyecto si pasa una semana sin actividad. Esta tarea llama, todos los días (antes
# lunes y jueves: el 29/10/2026 el proyecto se pausó igual y hubo que restaurarlo a mano),
# a la función registrar_latido() de la base (ver sql/migrations/0036_latido_para_que_supabase_no_se_pause.sql):
# anota la fecha en una tabla de una sola fila. No toca ventas, pagos, stock, caja ni historial.
# Usa solo la clave PÚBLICA de la tienda (la misma que ya está en js/shared/supabase-config.js): no hay contraseñas ni secretos.
#
# Si Supabase ya estuviera pausado o no respondiera, la tarea falla y GitHub avisa por mail.
# Se puede probar a mano desde la pestaña "Actions" del repo → "Mantener activo Supabase" → "Run workflow".
#
# Ojo: GitHub desactiva las tareas programadas de un repo que pasa 60 días sin ninguna actividad (commits).
# Si algún día se deja de tocar el repo por meses, entrar a Actions y volver a activar esta tarea.
on:
  schedule:
    - cron: '17 12 * * *'     # todos los días, 12:17 UTC (09:17 en Argentina)
  workflow_dispatch:

permissions: {}

jobs:
  latido:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Registrar el latido en la base
        run: |
          URL="https://pncrxtfxgomnxoveknys.supabase.co"
          KEY="sb_publishable_JTfYvnzLzcRo2_f1EcG4og_dRjffR2K"
          for intento in 1 2 3; do
            code=$(curl -s -o respuesta.txt -w "%{http_code}" -X POST "$URL/rest/v1/rpc/registrar_latido" \
              -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}')
            echo "Intento $intento: HTTP $code"
            cat respuesta.txt; echo
            if [ "$code" = "200" ]; then
              echo "Latido registrado."
              # Además se toca cada servicio de Supabase (autenticación, consulta de la tienda y archivos): el 8/11/2026 el
              # proyecto se pausó aunque el latido de la base había corrido el día anterior, así que se cubre todo por las dudas.
              # Estas llamadas son de solo lectura y NO hacen fallar la tarea.
              curl -s -o /dev/null -w "Autenticación: HTTP %{http_code}\n" "$URL/auth/v1/settings" -H "apikey: $KEY" || true
              curl -s -o /dev/null -w "Consulta de productos: HTTP %{http_code}\n" "$URL/rest/v1/productos?select=id&limit=1" -H "apikey: $KEY" || true
              curl -s -o /dev/null -w "Archivos: HTTP %{http_code}\n" "$URL/storage/v1/object/public/productos/latido.jpg" || true
              exit 0
            fi
            sleep 20
          done
          echo "No se pudo registrar el latido: revisar si el proyecto de Supabase está pausado."
          exit 1
